version: 1
name: grove-tools

repositories:
  grove:
    url: https://github.com/nicksenap/grove.git
    ref: master
  zellij:
    url: https://github.com/nicksenap/gw-zellij.git
    ref: master

jobs:
  test-grove:
    repository: grove
    timeout-minutes: 10
    steps:
      - name: Test Grove
        run: go test ./...

  test-zellij:
    repository: zellij
    timeout-minutes: 10
    steps:
      - name: Test Zellij plugin
        run: go test ./...

  verify:
    repository: grove
    needs: [test-grove, test-zellij]
    steps:
      - name: Confirm clean worktrees
        run: |
          test -z "$(git status --short)"
          test -z "$(git -C ../zellij status --short)"
