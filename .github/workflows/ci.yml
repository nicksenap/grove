name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./cmd/... ./internal/...
        env:
          GIT_CEILING_DIRECTORIES: /

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: go build -o gw ./cmd/gw

      - name: Run e2e tests
        run: go test ./e2e -count=1
        env:
          GW_BIN: ${{ github.workspace }}/gw
          GIT_CEILING_DIRECTORIES: /

  install-script:
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Run install.sh against latest release
        run: |
          GW_INSTALL_DIR="$RUNNER_TEMP/bin" sh scripts/install.sh
          "$RUNNER_TEMP/bin/gw" --version
        env:
          GITHUB_TOKEN: ${{ github.token }}
