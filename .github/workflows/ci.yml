name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Single source of truth: CI runs `just check` (tests incl. e2e, vet, gofmt,
  # gocyclo, staticcheck, deadcode). Add new checks to the Justfile, not here.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: extractions/setup-just@v4

      - name: just check
        run: just check
        env:
          GIT_CEILING_DIRECTORIES: /

  install-script:
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Run install.sh against latest release
        run: |
          GW_INSTALL_DIR="$RUNNER_TEMP/bin" sh scripts/install.sh
          "$RUNNER_TEMP/bin/gw" --version
        env:
          GITHUB_TOKEN: ${{ github.token }}
